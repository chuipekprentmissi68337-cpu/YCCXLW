name: Run MATLAB Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - "代码/**"
      - ".github/workflows/run-matlab.yml"

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_LICENSE_TOKEN }}

jobs:
  run-matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Patch MATLAB compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("代码/main.m")
          text = p.read_text(encoding="utf-8")
          text = text.replace("run_closed_loop_case('proposed', fleet, system_k, ev, station)", "run_closed_loop_case(\"proposed\", fleet, system_k, ev, station)")
          p.write_text(text, encoding="utf-8")
          PY

      - name: Run simulation
        uses: matlab-actions/run-command@v3
        with:
          command: "cd('代码'); try, main, catch ME, disp(getReport(ME, 'extended', 'hyperlinks', 'off')); exit(1); end"

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-simulation-output
          path: |
            代码/simulation_results.mat
            代码/simulation_results.xlsx
          if-no-files-found: warn
