name: Run MATLAB Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - "代码/**"
      - ".github/workflows/run-matlab.yml"

jobs:
  run-matlab:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest

      - name: Patch MATLAB compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("代码/main.m")
          text = p.read_text(encoding="utf-8")
          text = text.replace("run_closed_loop_case('proposed', fleet, system_k, ev, station)", "run_closed_loop_case(\"proposed\", fleet, system_k, ev, station)")
          old = """function response_prob = estimate_response_prob(num_vehicles, ev)
          g1 = randg(ev.response_alpha, num_vehicles, 1);
          g2 = randg(ev.response_beta, num_vehicles, 1);
          response_prob = g1 ./ max(g1 + g2, 1e-9);
          response_prob = min(max(response_prob, ev.participation_min), ev.participation_max);
          end
          """
          new = """function response_prob = estimate_response_prob(num_vehicles, ev)
          response_mean = ev.response_alpha / (ev.response_alpha + ev.response_beta);
          response_std = sqrt(ev.response_alpha * ev.response_beta / ((ev.response_alpha + ev.response_beta)^2 * (ev.response_alpha + ev.response_beta + 1)));
          response_prob = response_mean + response_std .* randn(num_vehicles, 1);
          response_prob = min(max(response_prob, ev.participation_min), ev.participation_max);
          end
          """
          text = text.replace(old, new)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Run simulation
        uses: matlab-actions/run-command@v3
        with:
          command: "cd('代码'); try, main, catch ME, disp(getReport(ME, 'extended', 'hyperlinks', 'off')); exit(1); end"

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-simulation-output
          path: |
            代码/simulation_results.mat
            代码/simulation_results.xlsx
          if-no-files-found: warn
